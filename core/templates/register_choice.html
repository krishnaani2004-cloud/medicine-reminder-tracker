<!DOCTYPE html>
<html lang="en">
<head>
 
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
      
        body {
            background: #191818;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: rgb(120, 115, 115);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(183, 146, 146, 0.1);
            text-align: center;
            width: 350px;
            
        }
           header {
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
        }
        footer {
      background: #222;
      color: white;
      padding: 10px;
      text-align: center;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
     
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #0DCAF0;
            color: white;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background: #75049e;
        }
    </style>
</head>
<body>
 
   <footer>
    © 2025 MedTrack — All rights reserved.
  </footer>

<div class="box">
    <h2>Select Registration Type</h2>
    <a href="{% url 'patient_register' %}" class="btn">Patient Register</a>
    <a href="{% url 'caretaker_register' %}" class="btn">Caretaker Register</a>
</div>

</body>
</html>
