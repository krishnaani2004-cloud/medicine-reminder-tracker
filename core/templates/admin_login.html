{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body {
            background: #111;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #222;
            padding: 35px;
            border-radius: 10px;
            width: 320px;
            color: white;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border-radius: 5px;
            border: none;
        }
        button {
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            border: none;
            background: #0af;
            color: white;
            border-radius: 4px;
            font-size: 16px;
        }
        h2 { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Login</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Admin Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        {% if error %}
            <p style="color:red; margin-top:10px;">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
