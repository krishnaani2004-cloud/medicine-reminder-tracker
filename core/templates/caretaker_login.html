{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caretaker Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1b2a;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .container {
            width: 350px;
            margin: 120px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: bold;
            color: #00eaff;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #00b4d8;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0096c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Caretaker Login</h2>

        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Enter Email" required>
            <input type="password" name="password" placeholder="Enter Password" required>

            <button class="btn" type="submit">Login</button>

            
        </form>

    </div>

</body>
</html>
